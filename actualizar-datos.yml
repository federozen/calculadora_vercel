name: Actualizar datos LPF

on:
  schedule:
    # Cada 2 horas (UTC). GitHub puede demorar unos minutos cada corrida.
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: public/app/requirements.txt

      - name: Instalar dependencias
        run: pip install -r public/app/requirements.txt

      - name: Traer resultados y tablas
        id: update
        continue-on-error: true
        env:
          TZ: America/Argentina/Buenos_Aires
        run: python scripts/actualizar_datos.py

      - name: Guardar cambios
        if: steps.update.outcome == 'success'
        run: |
          # Se firma con la cuenta dueña del repo para que Vercel acepte el deploy.
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add public/app/core/data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos LPF actualizados $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Avisar si las fuentes fallaron
        if: steps.update.outcome != 'success'
        run: |
          echo "::warning::No se pudo actualizar desde las fuentes en esta corrida. La app sigue con los datos anteriores."
